services:
  redis-stack:
    image: redis/redis-stack-server:latest
    container_name: ai-doc-redis-stack
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.53
    container_name: ai-doc-meilisearch
    ports:
      - "7700:7700"
    environment:
      # master key 必填（缺失将启动失败）；与 app 的 AI_MEILI_KEY 保持一致
      MEILI_MASTER_KEY: ${AI_MEILI_KEY:?请设置 AI_MEILI_KEY（Meilisearch master key，与 AI_MEILI_KEY 相同）}
      MEILI_ENV: production
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 内置 MySQL（自包含部署）；使用外部 OceanBase/MySQL 时删除本服务，
  # 并给 app 设置 DB_HOST/DB_PORT/DB_NAME/DB_USERNAME 指向外部库
  mysql:
    image: mysql:8.4
    container_name: ai-doc-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-wenqu_ai}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max_connections=${MYSQL_MAX_CONNECTIONS:-500}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    container_name: wen-qu
    # 默认仅绑定回环地址（127.0.0.1），避免 8090 直连暴露 Swagger/Actuator 等管理端点；
    # 对外提供服务请走 nginx/网关反向代理（浏览器只经 80/443，后端不直接暴露）。
    # 若确需对外直连后端（如内网无网关场景），export APP_PUBLISH=8090 后重新 up。
    ports:
      - "${APP_PUBLISH:-127.0.0.1:8090}:8090"
    environment:
      # 必填（无默认值，缺失将启动失败）
      DB_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
      # 可选：聊天网关的遗留回落密钥（仅在设置页未登记任何模型供应商时生效；正道是登记供应商）
      AI_CHAT_KEY: ${AI_CHAT_KEY:-}
      # 登录令牌签名密钥（≥32 位随机串）：留空则每次启动随机生成，重启后已发令牌全部失效；
      # 多副本部署必须各副本一致。建议在 .env 中写死（模板见 .env.example）
      AI_JWT_SECRET: ${AI_JWT_SECRET:-}
      # 容器时区：智能体/工作流定时任务按此时区求值（不设则默认 UTC，与北京时间差 8 小时）
      TZ: ${TZ:-Asia/Shanghai}
      # 数据库连接（默认连上方内置 mysql 服务；外部库改 DB_HOST/DB_PORT/DB_NAME/DB_USERNAME）
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-wenqu_ai}
      DB_USERNAME: ${DB_USERNAME:-root}
      # JVM 内存：按 8C16G 单机（本 compose 全家桶同机）估算——app 堆 6g，其余留给
      # MySQL(≈2g)/Meili(≈1g)/Redis(≈1g)/操作系统。小内存机器务必显式覆盖（如 --memory=2g
      # 容器建议 -Xmx1400m）。DB_POOL_MAX=40 时 MySQL max_connections 同步上调（见上方 mysql 服务）
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx6g}
      # 连接池（与 application.yml 默认值一致，单机部署可在此覆盖）
      DB_POOL_MAX: ${DB_POOL_MAX:-40}
      REDIS_POOL_MAX: ${REDIS_POOL_MAX:-64}
      # 可选
      REDIS_HOST: redis-stack
      REDIS_PORT: "6379"
      # 数据目录必须指向容器内挂载卷的路径（与下方 volumes app-data:/app/data 一致）
      AI_IMAGES_DIR: /app/data
      AI_IMAGES_AUTH_ENABLED: ${AI_IMAGES_AUTH_ENABLED:-true}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-info}
      # 关键词检索引擎（mysql=LIKE 零依赖；meilisearch=外部索引，需同时设置以下 Meili 相关变量）
      AI_KEYWORD_ENGINE: ${AI_KEYWORD_ENGINE:-mysql}
      AI_MEILI_BASE_URL: http://meilisearch:7700
      AI_MEILI_KEY: ${AI_MEILI_KEY:-}
      AI_MEILI_INDEX: ${AI_MEILI_INDEX:-ai-doc-chunks}
    volumes:
      - app-data:/app/data
    # app 容器内存上限：防堆外/元空间增长挤占同机中间件；堆 6g + 堆外余量 ≈ 8g
    mem_limit: ${APP_MEM_LIMIT:-8g}
    depends_on:
      mysql:
        condition: service_healthy
      redis-stack:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

volumes:
  redis-data:
  app-data:
  meili-data:
  mysql-data:
