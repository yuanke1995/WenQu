services:
  redis-stack:
    image: redis/redis-stack-server:latest
    container_name: ai-doc-redis-stack
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: ai-doc-meilisearch
    ports:
      - "7700:7700"
    environment:
      # master key 必填（缺失将启动失败）；与 app 的 AI_MEILI_KEY 保持一致
      MEILI_MASTER_KEY: ${AI_MEILI_KEY:?请设置 AI_MEILI_KEY（Meilisearch master key，与 AI_MEILI_KEY 相同）}
      MEILI_ENV: production
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 内置 MySQL（自包含部署）；使用外部 OceanBase/MySQL 时删除本服务，
  # 并给 app 设置 DB_HOST/DB_PORT/DB_NAME/DB_USERNAME 指向外部库
  mysql:
    image: mysql:8.4
    container_name: ai-doc-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ai_doc_assistant}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    container_name: wen-qu
    # 默认仅绑定回环地址（127.0.0.1），避免 8090 直连暴露 Swagger/Actuator 等管理端点；
    # 对外提供服务请走 nginx/网关反向代理（浏览器只经 80/443，后端不直接暴露）。
    # 若确需对外直连后端（如内网无网关场景），export APP_PUBLISH=8090 后重新 up。
    ports:
      - "${APP_PUBLISH:-127.0.0.1:8090}:8090"
    environment:
      # 必填（无默认值，缺失将启动失败）
      DB_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
      AI_CHAT_KEY: ${AI_CHAT_KEY:?请设置 AI_CHAT_KEY}
      # 数据库连接（默认连上方内置 mysql 服务；外部库改 DB_HOST/DB_PORT/DB_NAME/DB_USERNAME）
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-ai_doc_assistant}
      DB_USERNAME: ${DB_USERNAME:-root}
      # JVM 内存（容器内存限制的 60~75%；如 deploy 时 --memory=2g 建议 -Xmx1400m）
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx1400m}
      # 可选
      REDIS_HOST: redis-stack
      REDIS_PORT: "6379"
      # 数据目录必须指向容器内挂载卷的路径（与下方 volumes app-data:/app/data 一致）
      AI_IMAGES_DIR: /app/data
      AI_IMAGES_AUTH_ENABLED: ${AI_IMAGES_AUTH_ENABLED:-true}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-info}
      # 关键词检索引擎（mysql=LIKE 零依赖；meilisearch=外部索引，需同时设置以下 Meili 相关变量）
      AI_KEYWORD_ENGINE: ${AI_KEYWORD_ENGINE:-mysql}
      AI_MEILI_BASE_URL: http://meilisearch:7700
      AI_MEILI_KEY: ${AI_MEILI_KEY:-}
      AI_MEILI_INDEX: ${AI_MEILI_INDEX:-ai-doc-chunks}
    volumes:
      - app-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis-stack:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

volumes:
  redis-data:
  app-data:
  meili-data:
  mysql-data:
