server:
  port: 8095
  servlet:
    context-path: /v2
  # SSE 长连接：与问答流式输出配合，避免被容器超时切断
  tomcat:
    connection-timeout: 300s

spring:
  application:
    name: wenqu-server
  # 只排除 Spring Boot 的 Neo4j 自动装配，其余自动配置不受影响。
  #
  # 为什么必须排除：参考实现的 Neo4j 连接是「property 懒加载」——只有真正用到图谱能力时
  # 才建连接，未部署 Neo4j 时应用照常启动（见 storage/neo4j/Neo4jConnectionManager 的类注释，
  # 本工程同一语义）。而 Spring Boot 只要在 classpath 上探测到 org.neo4j.driver.Driver 类，
  # 就会用默认 spring.neo4j.uri=bolt://localhost:7687 立刻建一个 Driver 单例 bean，
  # actuator 还会连带注册 neo4j 健康检查：
  #   - 未装 Neo4j 时启动直接失败（本工程没有任何代码注入该 bean，纯属被自动装配牵连）；
  #   - 即便装了，也在启动期建立参考实现中不存在的进程级连接，与懒加载语义不符。
  # 因此这里把该自动配置（及其健康检查，见 management.health.neo4j）关掉。
  # 注意：不要图省事用 `spring.autoconfigure.exclude` 去排一大片类——排除向量存储等自动配置
  # 会导致检索链路缺少必需 bean 而启动失败，只排下面这一个类才是安全的。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration
  # 模型 bean 一律关闭自动装配：问答/向量客户端由 DynamicOpenAiChatModel、DynamicEmbeddingModel
  # 按数据库配置动态构建（密钥加密入库，yml 不落明文）。
  # 注意不能用 spring.autoconfigure.exclude 排除自动配置类——那会连向量存储的自动配置一起失去，
  # 检索链路将因缺少 VectorStore bean 而启动失败。用 model.*=false 只关模型、保留向量存储装配。
  ai:
    model:
      chat: false
      embedding: false
      audio:
        speech: false
        transcription: false
      image: false
      moderation: false
    openai:
      # 可为空：模型 bean 已关闭；仅供需要连接信息的基础设施读取
      api-key: ${WENQU_LLM_API_KEY:}
      base-url: ${WENQU_LLM_BASE_URL:https://llm-xdqpg8ip850vmxh3.cn-beijing.maas.aliyuncs.com/compatible-mode}
    vectorstore:
      redis:
        # Spring AI 1.1：index 更名 index-name；initialize-schema 默认 false，需显式开启
        initialize-schema: true
        index-name: ai-doc-index
        prefix: "ai:chunk:"
  # 首期复用现有业务库（知识库/文档/会话表同源），便于与旧后端并行对比验证；
  # 后续按新模型演进 schema 时再切换
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ai_doc_assistant?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${WENQU_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      # 必须显式指定 jedis：Spring AI 的 Redis 向量存储依赖 JedisConnectionFactory，
      # 而 Spring Boot 默认使用 Lettuce，不指定会导致 VectorStore 自动配置不生效。
      client-type: jedis
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      timeout: 3s
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 模型：与旧后端共用同一网关（OpenAI 兼容），值以数据库配置为准，这里只放最小兜底
wenqu:
  chat:
    base-url: ${WENQU_LLM_BASE_URL:https://llm-xdqpg8ip850vmxh3.cn-beijing.maas.aliyuncs.com/compatible-mode}
    completions-path: /v1/chat/completions
    api-key: ${WENQU_LLM_API_KEY:}
    model: qwen3.7-flash-2026-07-15
    temperature: 0.3
  embedding:
    base-url: ${WENQU_LLM_BASE_URL:https://llm-xdqpg8ip850vmxh3.cn-beijing.maas.aliyuncs.com/compatible-mode}
    embeddings-path: /v1/embeddings
    api-key: ${WENQU_LLM_API_KEY:}
    model: qwen3.7-text-embedding
  auth:
    # 未配置时启动期随机生成（重启后旧令牌失效）；生产请通过环境变量固定
    jwt-secret: ${WENQU_JWT_SECRET:}
    token-ttl-hours: 168
    issuer: wenqu
    audience: wenqu-api
    require-login: true
    max-login-failures: 5
    lock-minutes: 15
    min-password-length: 6

logging:
  level:
    root: info
    com.wisesoft.wenqu: debug

# 关掉 Neo4j 健康检查：它与上面的 Neo4jAutoConfiguration 是一对——Driver bean 已被排除，
# 健康检查再去找 Driver 只会让启动期多一个失败点。图谱能力自身的可用性由
# Neo4jConnectionManager 在调用时决定（连不上就抛错，不影响进程启动）。
management:
  health:
    neo4j:
      enabled: false
