server:
  port: 8090
  servlet:
    context-path: /ai

spring:
  application:
    name: ai-doc-assistant
  profiles:
    # 本地开发：local（每台机器独立的本地配置，位于项目根 config/application-local.yml——Spring Boot 外部配置目录，
    # 不进构建产物，含密钥与数据目录，已被 gitignore）
    # 生产部署：不激活 local（或激活但无 profile 文件即纯默认值），通过环境变量提供密钥与 AI_IMAGES_DIR
    active: local

  # 文件上传物理上限（防内存攻击；业务上限由 c_ai_config 的 upload.maxFileSize 控制，保存即生效）
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1100MB

  # 数据库（独立库；主机/端口/库名环境变量化以支持容器部署，密码必须通过 DB_PASSWORD 提供，缺失启动即失败）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:ai_doc_assistant}?useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&nullCatalogMeansCurrent=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  # 启动时自动执行 schema.sql 建表（CREATE TABLE IF NOT EXISTS，重复执行安全）
  sql:
    init:
      mode: always

  # Redis Stack（向量存储）
  data:
    redis:
      client-type: jedis
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}

  ai:
    # 模型密钥不在 yml/环境变量留明文：问答/向量客户端由 DynamicOpenAiChatModel/DynamicEmbeddingModel
    # 从 c_ai_config（RSA 加密入库）动态构建。关闭 spring-ai-starter-model-openai 自动装配的全部模型
    # bean——否则 yml 无明文 api-key 时 audio/chat/embedding 等 Factory bean 启动即抛 "API key must be set"
    model:
      chat: false
      embedding: false
      audio:
        speech: false
        transcription: false
      image: false
      moderation: false
    # LLM 对话：DeepSeek（OpenAI 兼容协议）——以下仅作 DB 未配置时的兜底默认
    openai:
      api-key: ${AI_DEEPSEEK_KEY:}
      base-url: https://llm-xdqpg8ip850vmxh3.cn-beijing.maas.aliyuncs.com/compatible-mode
      chat:
        options:
          # 注意：该 MaaS 网关对 qwen-max 返回 DashScope 原生格式(text 字段)，Spring AI 无法解析；
          # qwen-plus 返回标准 OpenAI 格式，流式/非流式均兼容
          model: qwen3.8-27b
          temperature: 0.3
      # Embedding 单独配置（DeepSeek 无 embedding，需用兼容 OpenAI 协议的向量服务）
      embedding:
        api-key: ${AI_EMBEDDING_KEY:}
        base-url: ${AI_EMBEDDING_BASE_URL:https://llm-xdqpg8ip850vmxh3.cn-beijing.maas.aliyuncs.com/compatible-mode}
        options:
          model: ${AI_EMBEDDING_MODEL:qwen3.7-text-embedding-flash}

    # Redis 向量库配置（Spring AI 1.1：index 更名 index-name；initialize-schema 默认 false，需显式开启）
    vectorstore:
      redis:
        initialize-schema: true
        index-name: ai-doc-index
        prefix: "ai:chunk:"

# MyBatis-Plus（SQL 日志默认走 slf4j，级别由 LOG_LEVEL_SQL 控制）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.slf4j.Slf4jImpl}
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 自定义 AI 配置
ai-app:
  # 文档分块
  chunk:
    max-size: 800
    overlap: 100
    # 单文档解析的最大知识块数（0=不限制；防止超大文档 embedding 数万次）
    max-chunks: 3000
    # 结构感知切分：标题/段落边界优先 + 章节标题路径注入（docx 生效，存量文档需重解析）
    structural: true
    structural-ratio: 0.8
  # 检索
  retrieval:
    top-k: 5
    # 混合检索融合权重（DB c_ai_config 可覆盖，设置页保存即生效）
    vector-weight: 0.6
    keyword-weight: 0.4
    title-bonus: 0.1
    # 重排（独立 reranker 服务，OpenAI 兼容 /v1/rerank；本地部署 scripts/win|mac/start_rerank_server.*）
    rerank:
      enabled: ${AI_RERANK_ENABLED:false}
      base-url: ${AI_RERANK_BASE_URL:http://localhost:7997}
      model: ${AI_RERANK_MODEL:BAAI/bge-reranker-v2-m3}
      timeout-ms: 5000
  # 关键词召回引擎（mysql=LIKE 零依赖但全表扫描；meilisearch=外部索引，中文分词+相关度打分）
  # 切到 meilisearch 后需先 POST /api/ai/search-index/reindex 建索引；服务不可用时自动降级回 mysql
  keyword:
    engine: ${AI_KEYWORD_ENGINE:mysql}
    base-url: ${AI_MEILI_BASE_URL:http://localhost:7700}
    api-key: ${AI_MEILI_KEY:}
    index: ${AI_MEILI_INDEX:ai-doc-chunks}
    timeout-millis: 1000
  # 会话
  session:
    max-history: 10
    expire-minutes: 30
    # anonymous 历史兼容池对具名用户共享可见；设 false 收紧为仅 anonymous（无 X-User-Id）调用方可访问
    anonymous-shared: ${AI_SESSION_ANONYMOUS_SHARED:true}
  # 接口限流（Redis 固定窗口，按用户/IP；Redis 不可用自动放行）
  ratelimit:
    enabled: ${AI_RATELIMIT_ENABLED:true}
    chat-per-minute: ${AI_RATELIMIT_CHAT:10}
    upload-per-minute: ${AI_RATELIMIT_UPLOAD:10}
  # 文档图片提取
  images:
    # 数据根目录（源文件/图片落盘）。默认 ./data（跨平台兜底）。
    # 本地开发在 application-local.yml（每机独立）配置本机绝对路径；
    # 生产必须通过 AI_IMAGES_DIR 指定容器内绝对路径（docker-compose 已设 /app/data）。
    dir: ${AI_IMAGES_DIR:./data}
    # 图片压缩：最长边像素，超过则等比缩小（0=不压缩）。压缩图仅供视觉模型识别（展示用原图）
    # 1280 是 qwen3-vl 视觉 token（约 1600-2500）下的最佳清晰度档，小字截图可识别；需配合 vision.num-ctx 防截断
    max-width: 1280
    # JPEG 压缩质量（0~1），带透明通道的图自动转 PNG 无损保留
    quality: 0.9
    url-prefix: /ai/images
    # 图片访问鉴权（HMAC 签名 URL + 过期时间；默认开启——漏配环境变量的独立部署不会裸奔暴露文档截图。
    # 本地开发如需关闭：在外部 config/application-local.yml 中设 ai-app.images.auth-enabled: false）
    auth-enabled: ${AI_IMAGES_AUTH_ENABLED:true}
    # 签名有效期（秒）
    auth-expire-seconds: 3600
    # 回答中 [图片N] 标记与图片描述的相关性校验（LLM 偶发错配兜底；无描述/无关键词自动放行，不误杀）
    image-filter:
      enabled: ${AI_IMAGE_FILTER_ENABLED:true}
      min-hits: 1
      pre-context-chars: 100
  # 图片描述（本地 Ollama 视觉模型，OpenAI 兼容协议；已实测返回标准 OpenAI 格式）
  vision:
    model: ${AI_VISION_MODEL:qwen3-vl:2b}
    # 约定：base-url 不含 /v1（代码自动拼 /v1/chat/completions）；Ollama 用 http://localhost:11434
    base-url: ${AI_VISION_BASE_URL:http://localhost:11434}
    # Ollama 不校验密钥，此处为占位值；如换回云端服务需改为真实 API Key
    api-key: ${AI_VISION_API_KEY:ollama}
    enabled: true
    # 单张图片描述超时（本地 2B 模型约 29s；文档图多时排队+推理可能超 60s，放宽到 180s 防误降级）
    timeout-millis: 180000
    # Ollama 上下文窗口：1280px 识别图视觉 token 约 1600-2500，默认 4096 会截断描述输出；0=不设置
    num-ctx: 16384
    # 图片描述并发度（本机 4GB 显存建议 2，避免并发压垮 Ollama 导致 500/超时）
    concurrency: 2
    # 单图失败重试次数（Ollama 偶发 500/超时，重试 1 次显著降低"无描述"降级）
    retry-count: 1
    # keep_alive 保持 qwen3-vl 常驻内存，避免每次文档解析都要重新加载模型（云端服务不支持需设 0）
    keep-alive-minutes: 30
    # 关闭思考模式（qwen3 系列默认思考，关闭后提速且输出稳定）
    think: ${AI_VISION_THINK:false}
  # 查询改写（默认关闭，开启后会对用户提问做 LLM 优化后再检索）
  query-rewrite:
    enabled: ${AI_QUERY_REWRITE_ENABLED:true}
    timeout-millis: 5000
  # 上下文与长度控制（价值驱动填充：预算 = min(窗口×系数−输出, 成本上限)，块按相关度累积）
  context:
    # 模型窗口映射（子串匹配当前 chat.model，未匹配用 default-window-tokens）
    model-windows: ${AI_CONTEXT_MODEL_WINDOWS:qwen-plus=131072,qwen3=131072,qwen-max=32768,deepseek=65536,default=32768}
    default-window-tokens: 32768
    safety-factor: 0.7
    # 成本软上限（token，0=不限制）：大窗口模型也防账单失控
    cost-cap-tokens: ${AI_CONTEXT_COST_CAP:8000}
    # 输出限制（同时从窗口预算中预留）
    max-output-tokens: 2000
    # 对话历史注入上限与单条截断
    history-max-tokens: 1200
    history-per-msg-chars: 200
    # 知识块命中片段窗口（命中关键词前后各 N 字，0=整块）
    snippet-window-chars: 150
    max-context-hits: 8
  # 深度思考（生产级：思考流式 → 提取检索计划 → 多路并行检索 → 回答）
  deep-reasoning:
    enabled: ${AI_DEEP_REASONING_ENABLED:true}
    # 思考模式：model=透传 enable_thinking 从 reasoning_content 提取；prompt=提示词引导输出到 content
    thinking-mode: ${AI_DEEP_REASONING_MODE:model}
    # 是否透传 enable_thinking=true（thinkingMode=model 时生效）
    enable-thinking: true
    # 检索计划标签名
    search-tag: search
    # 最大子问题数（不含精化 query）
    max-sub-queries: 3
    # 多路并行检索开关
    multi-retrieval: true
    # 思考阶段超时(ms)
    timeout-millis: 30000
    # 思考输出上限 token（0=不设，规避 qwen 思考模式 max_tokens 空输出）
    max-thinking-tokens: 0
  # 内部鉴权 token（与平台网关一致；必须通过环境变量 AI_TRUSTED_TOKEN 提供，缺失启动即失败）
  trusted-token: ${AI_TRUSTED_TOKEN}

logging:
  level:
    com.wisesoft.ai: ${LOG_LEVEL_APP:info}
    org.springframework.ai: ${LOG_LEVEL_SPRING_AI:info}

# 可观测性：健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS:never}

# SpringDoc OpenAPI (Swagger UI)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  show-actuator: false