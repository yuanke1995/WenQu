name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn verify
        run: mvn -B verify

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: unit test (pure modules)
        run: npm test
      - name: vite build
        run: npm run build

  sdk:
    name: SDK version / build / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # B1 出包闸门：四处版本号必须一致（JS 包清单/版本源，Python 包清单/版本源）
      - name: SDK version consistency
        run: node scripts/check-sdk-version.mjs
      - name: JS SDK strict build & tests
        working-directory: sdk/js
        run: |
          npm ci
          npm run build
          npm test
      - name: Python SDK install & tests
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m unittest discover -s tests -v

  contract:
    name: OpenAPI contract (no breaking changes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # v1 只增不删：删端点 / 改 scope / 改可达性一律失败；新增需先跑 --update 登记进快照与变更日志
      - name: v1 contract snapshot check
        run: node scripts/check-openapi-contract.mjs --check

  docs:
    name: Integration docs (single source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 文档站产物提交入库（应用内「对接文档」页 iframe 的就是它）。
      # 改了 guides/*.md / 契约快照 / 样例却没重新构建，这里失败——别改断言，跑构建并提交产物。
      - name: docs build up to date
        run: node scripts/build-docs.mjs --check

  samples:
    name: Integration samples syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 方案缺口 2：代码片段容易随契约漂移。这里不装样例依赖、不起服务，
      # 只挡「样例本身写坏了」——真链路靠 samples/*/README.md 里的本地实机步骤。
      - name: Sample scripts parse
        run: |
          node --check samples/seed/seed.mjs
          node --check samples/backend-node/server.mjs
          node --check samples/frontend-proxy/server.mjs
          python -m py_compile samples/backend-python/app.py
