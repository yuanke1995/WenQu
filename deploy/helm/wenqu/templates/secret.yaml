{{- if .Values.secrets.create }}
{{- if or (not .Values.secrets.values.dbPassword) (not .Values.secrets.values.jwtSecret) }}
{{- fail "secrets.create=true 就必须给 secrets.values.dbPassword 与 secrets.values.jwtSecret（AI_JWT_SECRET 至少 32 位随机串，且各副本一致）；用外部管理的 Secret 就设 secrets.existingSecret 并 secrets.create=false" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "wenqu.fullname" . }}-secrets"
  labels:
    {{- include "wenqu.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.dbPassword | quote }}: {{ .Values.secrets.values.dbPassword | quote }}
  {{ .Values.secrets.keys.jwtSecret | quote }}: {{ .Values.secrets.values.jwtSecret | quote }}
{{- end }}
