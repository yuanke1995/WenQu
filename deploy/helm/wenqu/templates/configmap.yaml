apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ include "wenqu.fullname" . }}-env"
  labels:
    {{- include "wenqu.labels" . | nindent 4 }}
data:
  # 必填但没有默认值的两项在 Secret 里（DB_PASSWORD / AI_JWT_SECRET）：
  # 缺失时后端启动即失败，而不是悄悄用随机密钥上线（多副本下各签各验＝登录随机 401）
  SPRING_PROFILES_ACTIVE: {{ .Values.config.springProfilesActive | quote }}
  TZ: {{ .Values.config.timezone | quote }}
  SERVER_PORT: {{ .Values.containerPort | quote }}
  JAVA_OPTS: {{ .Values.javaOpts | quote }}
  DB_HOST: {{ .Values.config.dbHost | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  DB_USERNAME: {{ .Values.config.dbUsername | quote }}
  DB_POOL_MAX: {{ .Values.config.dbPoolMax | quote }}
  REDIS_POOL_MAX: {{ .Values.config.redisPoolMax | quote }}
  {{- if .Values.builtinRedis.enabled }}
  REDIS_HOST: "{{ include "wenqu.fullname" . }}-redis"
  {{- else }}
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  {{- end }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  LOG_LEVEL_APP: {{ .Values.config.logLevelApp | quote }}
  LOG_DIR: "{{ .Values.persistence.data.mountPath }}/logs"
  AI_IMAGES_DIR: {{ .Values.persistence.data.mountPath | quote }}
  AI_IMAGES_AUTH_ENABLED: {{ .Values.config.imagesAuthEnabled | quote }}
  # 框架工作区（个人记忆 MEMORY.md/日账、技能、plans）必须落在卷上：不指过去就是写在容器可写层，
  # 一次重新部署就把所有人攒的记忆清掉
  AI_AGENTSCOPE_STATE_DIR: "{{ .Values.persistence.data.mountPath }}/agentscope"
  # 用户自装技能落盘根（wenqu.skills.users-dir）：不指到卷上，一次重新部署就把所有人装过的技能清掉
  WENQU_SKILLS_USERS_DIR: {{ .Values.persistence.userData.mountPath | quote }}
  AI_KEYWORD_ENGINE: {{ .Values.config.keywordEngine | quote }}
  {{- if .Values.config.meiliBaseUrl }}
  AI_MEILI_BASE_URL: {{ .Values.config.meiliBaseUrl | quote }}
  AI_MEILI_KEY: {{ .Values.config.meiliKey | quote }}
  AI_MEILI_INDEX: {{ .Values.config.meiliIndex | quote }}
  {{- end }}
  {{- if .Values.config.sandboxProvisionerUrl }}
  SANDBOX_PROVISIONER_URL: {{ .Values.config.sandboxProvisionerUrl | quote }}
  SANDBOX_PROVISIONER_TOKEN: {{ .Values.config.sandboxProvisionerToken | quote }}
  SANDBOX_CALLBACK_BASE_URL: {{ .Values.config.sandboxCallbackBaseUrl | quote }}
  SANDBOX_VIRTUAL_PATH_PREFIX: {{ .Values.config.sandboxVirtualPathPrefix | quote }}
  {{- end }}
  {{- if .Values.config.ocrPpStructureUri }}
  OCR_PP_STRUCTURE_URI: {{ .Values.config.ocrPpStructureUri | quote }}
  {{- end }}
  {{- if .Values.config.ocrMinerUUri }}
  OCR_MINERU_URI: {{ .Values.config.ocrMinerUUri | quote }}
  {{- end }}
  OCR_MINERU_BACKEND: {{ .Values.config.ocrMinerUBackend | quote }}
  OCR_TIMEOUT_MS: {{ .Values.config.ocrTimeoutMs | quote }}
  {{- if .Values.builtinMysql.enabled }}
  # 内置 MySQL 只给开发/试用：没有备份与主从，生产请用外部数据库
  {{- end }}
