{{- if .Values.persistence.data.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ include "wenqu.fullname" . }}-data"
  labels:
    {{- include "wenqu.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.data.accessMode | quote }}
  {{- if .Values.persistence.data.storageClass }}
  storageClassName: {{ .Values.persistence.data.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size | quote }}
{{- end }}
{{- if .Values.persistence.userData.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ include "wenqu.fullname" . }}-user-data"
  labels:
    {{- include "wenqu.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.userData.accessMode | quote }}
  {{- if .Values.persistence.userData.storageClass }}
  storageClassName: {{ .Values.persistence.userData.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.userData.size | quote }}
{{- end }}
