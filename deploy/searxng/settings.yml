# SearXNG 本地实例配置（问渠联网搜索 generic 服务商专用）
#
# 最小化配置：基于官方默认值（use_default_settings: true）覆盖五处——
# 1. secret_key：实例密钥，必须设置否则起不来
# 2. limiter=false：本地单用户实例必须关。SearXNG 自带的防爬限流会把「无浏览器
#    指纹的程序化 JSON 请求」当机器人拦掉（429/403），这正是问渠的调用形态
# 3. search.formats 显式含 json：不加的话 /search?format=json 直接 403
#    （SearXNG 默认只开 html，这是"通了但返回 403"的头号原因）
# 4. search.default_lang：搜索语言，缺了 bing 会返回无关降级页（见下方说明）
# 5. engines：只保留境内可达引擎（见下方说明），并放宽出站超时
#
# ── 为什么换成境内引擎组合 ──────────────────────────────────────
# 实例部署在境内云主机上，默认引擎里的 brave / duckduckgo / google cse /
# wikipedia / wikidata 全部出不去。症状是 /search?format=json 返 HTTP 200 但
# results 为空，unresponsive_engines 里挂着一串 "timeout"：
#
#   en.wikipedia.org  -> 2001::1        （与 www.google.com 同址，物理上不可能）
#   duckduckgo.com    -> 2a03:2880:...  （face:b00c 是 Facebook 网段）
#
# 即 DNS 应答被污染返回伪造地址，连接阶段静默丢包直到超时。IPv4 强制
# （curl -4）同样超时，说明不是 IPv6 独有问题，而是整机没有墙外出口。
# 这类故障在 settings.yml 里改任何参数都治不了，只能换引擎。
#
# 选型依据（keep_only 按引擎 name 匹配，官方 settings_loader 只认 name）：
#   bing          -> base_url 覆盖为 cn.bing.com，官方注释即为此场景
#   360search     -> 境内直连可用，补足中文结果；引擎内 http_get 硬编码 10s 超时
#   sogou wechat  -> 公众号文章，补足中文长尾内容
#   quark         -> 时好时坏：上游返回形状漂移时整引擎崩，恢复后能出结果，保留观察
#   baidu         -> 云主机出口 IP 常被判验证码（Suspended: CAPTCHA），保留待恢复
#   sogou         -> 当前镜像里引擎自身报 SXNG_Response 无 next_request，恒崩；
#                    留着等上游/镜像修复，不参与出数也不影响其他引擎
# 2026-11-15 实测：关掉 default_lang 时 bing 对「考勤系统」返回「西游释厄传2」贴吧/
# 模拟器下载；补上后同一查询恢复考勤百科/钉钉考勤。应用侧 GenericSearchProvider
# 也会显式带 language（中文 zh-CN、其余 en），实例默认值仅作兜底。
#
# 想要墙外结果（google / ddg / wikipedia）只能给 outgoing 段配 proxies，
# 届时把 keep_only 相应放开：
#   outgoing:
#     proxies:
#       all://:
#         - http://user:pass@proxy-host:port
use_default_settings:
  engines:
    keep_only:
      - bing
      - baidu
      - sogou
      - quark
      - 360search
      - sogou wechat

server:
  secret_key: "d0ebe9f7219447d27d78bf45c010f5312cc8f68adee2be0233fabaf11756dde5"
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json
  # 搜索语言必须钉死 zh-CN。键名是 default_lang——不是 default_locale
  # （后者是 server 段的界面 locale，不是搜索语言；放进 search 段会被忽略）。
  # 问渠是程序化 JSON 调用、不带 Accept-Language，语言落空时 bing 走国际版模式：
  # 中文查询返回轮换的无关降级页（实测「考勤系统」→ 西游释厄传2 贴吧/模拟器下载），
  # HTTP 200、格式完好，只是内容全不对；带 language=zh-CN 的同一查询恢复全对。
  default_lang: "zh-CN"

# 默认 3.0s 对境内引擎偏紧（sogou/quark 首字节常在 2s 上下），调到 6.0s
outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0

# 上面 keep_only 里的引擎在官方默认配置中均为 disabled: true，
# keep_only 只做筛除不做启用，必须在此逐个显式打开
engines:
  - name: bing
    disabled: false
    base_url: https://cn.bing.com
  - name: baidu
    disabled: false
  - name: sogou
    disabled: false
  - name: quark
    disabled: false
  - name: 360search
    disabled: false
  - name: sogou wechat
    disabled: false
