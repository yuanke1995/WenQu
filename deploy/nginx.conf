# ============================================================
# 问渠（WenQu）生产部署 Nginx 配置（独立部署参考）
# 前端 dist/ 静态托管 + /api/ 反向代理到后端；认证由后端本地登录（JWT）完成
# ============================================================

server {
    listen 80;
    server_name _;

    # 文档上传物理上限（与后端 multipart 1GB 一致；业务上限由 c_ai_config upload.maxFileSize 控制）
    client_max_body_size 1024m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 网关透传路径：/api/ai/* → 后端 /ai/api/ai/*
    location /api/ {
        proxy_pass http://app:8090/ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 用直连来源覆盖 X-Forwarded-For：丢弃客户端伪造的 XFF（后端限流/身份解析取首段，
        # 若继续用 $proxy_add_x_forwarded_for 追加，客户端可自报 IP 绕过限流）
        proxy_set_header X-Forwarded-For $remote_addr;
        # 安全边界：身份只认登录令牌（Authorization: Bearer JWT），由浏览器携带、本层原样转发，
        # 后端校验签名后判定用户与角色。切勿在本层注入/覆盖任何身份头，也勿转发客户端自报的
        # 身份头（历史上曾用的 X-User-Id 已被废弃，伪造即可提权）——建议在网关层统一剥离未知头。
        proxy_connect_timeout 10s;
        proxy_read_timeout 320s;
    }

    # 文档图片静态资源（SSE 之外的普通代理，可缓存）
    location /ai/images/ {
        proxy_pass http://app:8090;
        proxy_set_header Host $host;
        proxy_cache_valid 200 10m;
        add_header Cache-Control "public, max-age=600";
    }

    # SSE 流式接口：必须关闭响应缓冲，否则流式 token 无法实时到达
    location ~* /(api|proxy)/ai/chat {
        proxy_pass http://app:8090;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 320s;
        proxy_set_header X-Accel-Buffering no;
    }
}
