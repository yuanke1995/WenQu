# ============================================================
# 问渠（WenQu）生产部署 Nginx 配置（独立部署参考 · 宿主机 nginx）
# 前端 dist/ 静态托管 + /api/ 反向代理到后端；认证由后端本地登录（JWT）完成
#
# 适用拓扑：后端 docker compose 部署（app 发布在 127.0.0.1:8090），
# 本机 nginx 托管前端 dist 并反代，浏览器只访问 80/443。
# 使用：dist 产物放到 root 目录；本文件存为 /etc/nginx/sites-available/wenqu
# 并 ln -s 进 sites-enabled/，nginx -t 通过后 reload。
# ============================================================

server {
    listen 80;
    server_name _;

    # 文档上传物理上限（与后端 multipart 1GB 一致；业务上限由 c_ai_config upload.maxFileSize 控制）
    client_max_body_size 1024m;

    root /var/www/wenqu;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 前端 API 前缀 /api/ai/* → 后端 /ai/api/ai/*
    # 后端 context-path=/ai、控制器挂 /api/ai，故此处把 /api/ 前缀替换为 /ai/api/。
    # 注意：写成 /ai/ 会把路径拼成 /ai/ai/... 导致全部 404。
    location /api/ {
        proxy_pass http://127.0.0.1:8090/ai/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 用直连来源覆盖 X-Forwarded-For：丢弃客户端伪造的 XFF（后端限流/身份解析取首段，
        # 若继续用 $proxy_add_x_forwarded_for 追加，客户端可自报 IP 绕过限流）
        proxy_set_header X-Forwarded-For $remote_addr;
        # 安全边界：身份只认登录令牌（Authorization: Bearer JWT），由浏览器携带、本层原样转发，
        # 后端校验签名后判定用户与角色。切勿在本层注入/覆盖任何身份头，也勿转发客户端自报的
        # 身份头（历史上曾用的 X-User-Id 已被废弃，伪造即可提权）——建议在网关层统一剥离未知头。
        # SSE 全部落在该前缀下（对话 /chat、分享聊天 /share/{token}/chat、工作流运行流
        # /workflow/run/{id}/stream），统一关闭响应缓冲，否则流式 token 无法实时到达
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_connect_timeout 10s;
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
    }

    # 后端 context-path 直通：/ai/images/**（文档图片）、/ai/artifacts/**（产物签名下载）等原样透传
    location /ai/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 320s;
    }

    # 文档图片：浏览器侧短缓存（签名 URL 不变时减少重复拉取）
    location /ai/images/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=600";
    }

    # 对外 MCP 端点（/ai/mcp，Streamable HTTP 本身即流式；未启用 MCP 服务时可删）
    location /ai/mcp {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 320s;
    }
}
