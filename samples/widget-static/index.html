<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>问渠样例 · L0 零代码嵌入</title>
<style>
  body { font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         color: #2c2c2a; background: #f7f6f2; margin: 0; padding: 2rem 1.25rem; }
  main { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 15px; font-weight: 500; margin: 0 0 6px; }
  .card { background: #fff; border: 0.5px solid rgba(0,0,0,.15); border-radius: 12px;
          padding: 1rem 1.25rem; margin-top: 1.5rem; }
  code { background: #f1efe8; border-radius: 4px; padding: 1px 5px; }
  .badge { display: inline-block; font-size: 12px; color: #0f6e56; background: #e1f5ee;
           border-radius: 8px; padding: 2px 8px; }
  p { margin: 8px 0 0; }
</style>
</head>
<body>
<main>
  <h1>L0 零代码嵌入</h1>
  <span class="badge">浏览器零凭据 · 分享 token 不是 API Key</span>
  <div class="card">
    <p>右下角浮窗由问渠站点的 <code>wenqu-embed.js</code> 渲染，里面套的是
       <code>/s/{token}</code> 的 iframe。宿主页面不接触任何 API Key。</p>
    <p id="state">正在加载…</p>
    <p>没有浮窗？打开这个页面时要带两个参数：<code>?origin=http://127.0.0.1:5800&amp;token=&lt;分享token&gt;</code>，
       且必须用 HTTP 打开（不能用 <code>file://</code>）。<code>origin</code> 要填问渠的
       <b>前端站点</b>（本机 Vite dev 是 5800），不是后端 API 实例 8090/8111。</p>
  </div>
</main>
<script>
const q = new URLSearchParams(location.search);
const origin = (q.get('origin') || 'http://127.0.0.1:5800').replace(/\/+$/, '');
const token = q.get('token') || '';
const state = document.getElementById('state');
if (!token) {
  state.textContent = '未提供分享 token：请在智能体「发布分享」后把 token 填进 URL 的 ?token= 参数。';
} else {
  const s = document.createElement('script');
  s.src = origin + '/wenqu-embed.js';
  s.onload = () => {
    if (!window.WenquChat || !window.WenquChat.init) {
      state.textContent = '脚本已加载但没有 WenquChat.init，检查 ' + origin + '/wenqu-embed.js 是否是问渠的嵌入脚本。';
      return;
    }
    window.WenquChat.init({ token: token, title: '样例 · 在线咨询', autoOpen: true });
    state.textContent = '浮窗已初始化（脚本来自 ' + origin + '，iframe 与脚本同源）。';
  };
  s.onerror = () => { state.textContent = '加载失败：' + origin + '/wenqu-embed.js 不可达，确认问渠实例已启动。'; };
  document.head.appendChild(s);
}
</script>
</body>
</html>
